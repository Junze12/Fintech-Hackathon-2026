[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sme-copilot"
version = "0.1.0"
description = "Fintellect (SME Finance Copilot): an AI agent for Singapore small-business finance (2026 Shenzhen FinTech Competition, Topic E)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyyaml>=6",
    "httpx>=0.27",
]
ui = [
    "streamlit>=1.38",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
]
llm = [
    "anthropic>=1.12,<2",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: calls the real Claude API (costs money); run with RUN_LIVE=1 pytest -m live",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
